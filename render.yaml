# Companion on Render.
#
# Three services and two datastores. The web service serves the product; the
# worker does every piece of long-running document work so no HTTP request
# waits on LibreOffice; the migrator is a one-off job run before each release.
#
# Every secret is sync:false — Render prompts for it once and it is never
# stored in this repository. Nothing here contains a real key.
#
# Object storage is deliberately not a Render disk. A disk is attached to one
# instance and does not survive a redeploy, so it cannot be the canonical home
# of a customer's documents; the storage durability check reports exactly that
# if it is ever pointed at one.

databases:
  - name: companion-postgres
    databaseName: companion
    user: companion
    plan: standard
    postgresMajorVersion: '16'
    ipAllowList: []

services:
  # ─── Redis ────────────────────────────────────────────────────────────────
  - type: keyvalue
    name: companion-redis
    plan: standard
    ipAllowList: []
    # Jobs are durable in Postgres as well, so evicting a queued job loses
    # throughput rather than work.
    maxmemoryPolicy: noeviction

  # ─── Web ──────────────────────────────────────────────────────────────────
  - type: web
    name: companion-web
    runtime: node
    plan: standard
    region: frankfurt
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build:web
    startCommand: pnpm --filter @companion/web start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: APP_URL
        fromService:
          type: web
          name: companion-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          type: web
          name: companion-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: companion-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: companion-redis
          property: connectionString
      # Shared with the worker so a cookie minted by one is readable by both.
      - key: SESSION_SECRET
        generateValue: true
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PERSONAL_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PERSONAL_ANNUAL
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PRO_ANNUAL
        sync: false
      - key: STRIPE_PRICE_BUSINESS_MONTHLY
        sync: false
      - key: STRIPE_PRICE_BUSINESS_ANNUAL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_URL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SUPER_ADMIN_EMAILS
        sync: false
      - key: LOG_LEVEL
        value: info

  # ─── Worker ───────────────────────────────────────────────────────────────
  # Docker rather than the Node runtime: conversion needs LibreOffice and
  # Poppler, which are system packages.
  - type: worker
    name: companion-worker
    runtime: docker
    plan: standard
    region: frankfurt
    branch: main
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: companion-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: companion-redis
          property: connectionString
      - key: SESSION_SECRET
        fromService:
          type: web
          name: companion-web
          envVarKey: SESSION_SECRET
      - key: APP_URL
        fromService:
          type: web
          name: companion-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WORKER_CONCURRENCY
        value: '4'
      - key: VISION_READING_ENABLED
        value: 'true'
      - key: VISION_MAX_PAGES_PER_FILE
        value: '400'
      - key: PREVIEW_TEXT_AUDIT_ENABLED
        value: 'true'
      - key: LOG_LEVEL
        value: info

  # ─── Migrations ───────────────────────────────────────────────────────────
  # Run this before promoting a release. Migrations are plain SQL, applied one
  # transaction each and recorded in schema_migrations, so re-running is safe.
  - type: worker
    name: companion-migrate
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @companion/db build
    startCommand: pnpm --filter @companion/db exec node dist/migrate.js
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        fromDatabase:
          name: companion-postgres
          property: connectionString
