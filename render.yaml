# Companion on Render.
#
# Two services and two datastores. The web service serves the product and runs
# migrations once per deploy; the worker does every piece of long-running
# document work, so no HTTP request ever waits on LibreOffice.
#
# Every secret is sync:false — Render prompts for it once and it is never
# stored in this repository. Nothing here contains a real key.
#
# Neither service declares a branch, so both track the repository's default
# branch. Naming one here would break the moment the default is renamed or the
# repository is forked.
#
# Object storage is deliberately not a Render disk. A disk does persist across
# restarts and redeploys — that is not the problem. It belongs to a single
# service instance, and Companion runs two: the worker could not read what the
# web service wrote, so every document would upload and then sit in processing
# forever. It also rules out running more than one instance of that service.
# Hence S3-compatible storage, which the readiness report checks on startup.

databases:
  - name: companion-postgres
    databaseName: companion
    user: companion
    # Render retired the legacy plan names ('standard' among them). Basic-1GB
    # is the smallest tier worth giving pgvector: the HNSW index wants to sit
    # in memory, and a query that has to read it from disk is the slow half of
    # every question. Upgrading later is a plan change, not a migration.
    plan: basic-1gb
    # Same region as the services. A database in another region adds a
    # round trip to every query, and retrieval makes two per question.
    region: frankfurt
    postgresMajorVersion: '16'
    # Empty means "internal network only": nothing reaches it from the public
    # internet, which is where customer documents are indexed.
    ipAllowList: []

services:
  # ─── Redis ────────────────────────────────────────────────────────────────
  - type: keyvalue
    name: companion-redis
    plan: standard
    # Same region as the services and the database. Every job dispatch is a
    # round trip; across an ocean it is a slow one.
    region: frankfurt
    ipAllowList: []
    # Jobs are durable in Postgres as well, so evicting a queued job loses
    # throughput rather than work.
    maxmemoryPolicy: noeviction

  # ─── Web ──────────────────────────────────────────────────────────────────
  - type: web
    name: companion-web
    runtime: node
    plan: standard
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build:web
    # Runs once per deploy, before the new release takes traffic. Migrations
    # are plain SQL in one transaction each and recorded in schema_migrations,
    # so a re-run is a no-op. A worker service would be restarted forever
    # after it exited, which is why this is not one.
    preDeployCommand: pnpm --filter @companion/db exec node dist/migrate.js
    startCommand: pnpm --filter @companion/web start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      # The e2e workspace pulls in Playwright; nothing on a server runs a
      # browser, so its postinstall must not fetch one.
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: '1'
      # APP_URL is deliberately absent. Render's own RENDER_EXTERNAL_URL is
      # used until it is set, so the first deploy produces working share links
      # with nothing typed. Add it in the dashboard when a custom domain is
      # attached; it resolves per request, so no rebuild is needed.
      - key: DATABASE_URL
        fromDatabase:
          name: companion-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: companion-redis
          property: connectionString
      # Shared with the worker so a cookie minted by one is readable by both.
      - key: SESSION_SECRET
        generateValue: true
      - key: STORAGE_DRIVER
        value: s3
      # ── The only five values you have to type. ──────────────────────────
      # A bucket cannot be guessed and storage cannot be skipped: the worker
      # and the web service run on different instances, so a shared object
      # store is the only place both can see the same document.
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Answers and semantic search. Without it documents still open and index
      # for keyword search, so this one can wait if you only want to look.
      - key: OPENAI_API_KEY
        sync: false
      # Grants /admin at registration to any address listed here.
      - key: SUPER_ADMIN_EMAILS
        sync: false

      # ── Everything else has a working default. ──────────────────────────
      # `auto` suits S3 and R2 alike; override in the dashboard for a bucket
      # that needs an explicit region.
      - key: S3_REGION
        value: auto
      # Declared empty rather than omitted, for one reason: the worker
      # inherits it below. AWS needs no endpoint, so blank is correct there
      # and the app reads a blank value as unset. For Cloudflare R2, Backblaze
      # B2, Supabase or MinIO, paste the S3 API URL here — in this one place —
      # and the worker picks up the same one. Setting it on only one of the
      # two services is the failure this avoids: uploads would land in one
      # store and the worker would look for them in another, so every document
      # would sit in processing forever.
      - key: S3_ENDPOINT
        value: ''
      # Needed by MinIO and some self-hosted stores. Same reasoning.
      - key: S3_FORCE_PATH_STYLE
        value: 'false'
      #
      # Email is optional — Companion does not send share links, the sender
      # copies the link and shares it themselves. Only magic-link sign-in and
      # the two confirm-by-email access modes need delivery.
      - key: EMAIL_PROVIDER
        value: none
      # Stripe and Google sign-in are not declared at all. Billing hides
      # itself while STRIPE_SECRET_KEY is unset, so nothing in the interface
      # leads anywhere that would fail. Add the keys in the dashboard when
      # you want to sell plans; no redeploy of this file is needed.
      - key: LOG_LEVEL
        value: info

  # ─── Worker ───────────────────────────────────────────────────────────────
  # Docker rather than the Node runtime: conversion needs LibreOffice and
  # Poppler, which are system packages.
  - type: worker
    name: companion-worker
    runtime: docker
    plan: standard
    region: frankfurt
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: companion-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: companion-redis
          property: connectionString
      - key: SESSION_SECRET
        fromService:
          type: web
          name: companion-web
          envVarKey: SESSION_SECRET
      # No APP_URL and no RENDER_EXTERNAL_URL here, for two reasons. Render
      # resolves fromService against the variables a service actually has, so
      # referencing one the web service never declares — APP_URL is deliberately
      # unset, RENDER_EXTERNAL_URL is injected by the platform rather than
      # declared — is rejected at blueprint creation. And the worker has no use
      # for the public origin anyway: it only reaches storage as `publicBaseUrl`,
      # which none of the S3 driver reads. It exists for the local driver, and
      # production refuses that driver outright.
      - key: STORAGE_DRIVER
        value: s3
      # Read from the web service rather than asked for again. The two must
      # point at the same bucket and the same provider by definition — typing
      # them twice only creates a way for them to disagree.
      - key: S3_BUCKET
        fromService:
          type: web
          name: companion-web
          envVarKey: S3_BUCKET
      - key: S3_REGION
        fromService:
          type: web
          name: companion-web
          envVarKey: S3_REGION
      - key: S3_ACCESS_KEY_ID
        fromService:
          type: web
          name: companion-web
          envVarKey: S3_ACCESS_KEY_ID
      - key: S3_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: companion-web
          envVarKey: S3_SECRET_ACCESS_KEY
      # The endpoint matters as much as the bucket: the same bucket name at a
      # different endpoint is a different store. Inheriting it is what makes
      # "set it once on the web service" true.
      - key: S3_ENDPOINT
        fromService:
          type: web
          name: companion-web
          envVarKey: S3_ENDPOINT
      - key: S3_FORCE_PATH_STYLE
        fromService:
          type: web
          name: companion-web
          envVarKey: S3_FORCE_PATH_STYLE
      - key: OPENAI_API_KEY
        fromService:
          type: web
          name: companion-web
          envVarKey: OPENAI_API_KEY
      - key: WORKER_CONCURRENCY
        value: '4'
      - key: VISION_READING_ENABLED
        value: 'true'
      - key: VISION_MAX_PAGES_PER_FILE
        value: '400'
      - key: PREVIEW_TEXT_AUDIT_ENABLED
        value: 'true'
      - key: LOG_LEVEL
        value: info
